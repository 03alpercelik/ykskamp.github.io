<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#6c5ce7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>YKS Kamp Takip Pro</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <script>
        const savedTheme = localStorage.getItem("theme") || "light";
        document.documentElement.setAttribute("data-theme", savedTheme);
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        tailwind.config = {
            darkMode: ['class', '[data-theme="dark"]'],
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            light: '#6c5ce7',
                            dark: '#4f46e5',
                            accent: '#a29bfe'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --bg-color: #f8f9fa; --card-bg: #ffffff; --text-color: #2d3436; --secondary-text: #636e72;
            --table-border: #dfe6e9; --header-bg: linear-gradient(135deg, #6c5ce7, #a29bfe);
            --row-even: #f1f2f6; --row-odd: #ffffff; --highlight: #dbeafe; --accent: #00b894;
            --edit-color: #0984e3; --danger-color: #ff7675; --stat-bg: #e0f2f1;
            --past-day-bg: #e2e8f0; --dropdown-hover: #f1f2f6;
        }
        [data-theme="dark"] {
            --bg-color: #0f172a; --card-bg: #1e293b; --text-color: #f8fafc; --secondary-text: #94a3b8;
            --table-border: #334155; --header-bg: linear-gradient(135deg, #4f46e5, #818cf8);
            --row-even: #1e293b; --row-odd: #0f172a; --highlight: #1e40af; --accent: #10b981;
            --edit-color: #3b82f6; --danger-color: #ef4444; --stat-bg: #064e3b;
            --past-day-bg: #162032; --dropdown-hover: #334155;
        }

        .status-online { background-color: rgba(0, 184, 148, 0.15) !important; color: #00b894 !important; }
        .status-offline { background-color: rgba(255, 118, 117, 0.15) !important; color: #ff7675 !important; }
        .status-syncing { background-color: rgba(253, 203, 110, 0.15) !important; color: #fdcb6e !important; }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 184, 148, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(0, 184, 148, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 184, 148, 0); } }
        .btn-edit.active { animation: pulse 2s infinite; }
        
        @keyframes streak-burn {
            0% { transform: scale(1); filter: drop-shadow(0 0 2px #00d2ff); }
            100% { transform: scale(1.06) rotate(-1deg); filter: drop-shadow(0 0 10px #0066ff); }
        }
        .streak-active { animation: streak-burn 1.2s ease-in-out infinite alternate; font-weight: 900 !important; box-shadow: 0 0 12px #2563eb, inset 0 0 6px #1d4ed8; }
        
        #schedule-table th:first-child, #schedule-table td:first-child { position: sticky !important; left: 0; z-index: 15; border-right: 2px solid var(--table-border); }
        #schedule-table thead th:first-child { z-index: 25; } 

        tr:nth-child(even) { background-color: var(--row-even); }
        tr:nth-child(odd) { background-color: var(--row-odd); }
        tr:nth-child(even) td:first-child { background-color: var(--row-even) !important; }
        tr:nth-child(odd) td:first-child { background-color: var(--row-odd) !important; }

        .past-day { opacity: 0.65; filter: grayscale(0.5); }
        .past-day:hover { opacity: 1; filter: none; }
        .past-day td:first-child { background-color: var(--past-day-bg) !important; }

        #schedule-table tr.today-highlight td { background-color: #dbeafe !important; color: #1e293b !important; font-weight: 700 !important; }
        [data-theme="dark"] #schedule-table tr.today-highlight td { background-color: #1e40af !important; color: #ffffff !important; }
        
        #schedule-table tr.today-highlight td:first-child { background-color: #dbeafe !important; color: #1e293b !important; }
        [data-theme="dark"] #schedule-table tr.today-highlight td:first-child { background-color: #1e40af !important; color: #ffffff !important; }

        #schedule-table tr.today-highlight .task-label,
        #schedule-table tr.today-highlight .task-text,
        #schedule-table tr.today-highlight .completed-text,
        #schedule-table tr.today-highlight .date-cell { color: #1e293b !important; }
        
        [data-theme="dark"] #schedule-table tr.today-highlight .task-label,
        [data-theme="dark"] #schedule-table tr.today-highlight .task-text,
        [data-theme="dark"] #schedule-table tr.today-highlight .completed-text,
        [data-theme="dark"] #schedule-table tr.today-highlight .date-cell { color: #ffffff !important; }

        #schedule-table tr.today-highlight .time-tag { background-color: rgba(30, 64, 175, 0.1) !important; color: #1e293b !important; }
        [data-theme="dark"] #schedule-table tr.today-highlight .time-tag { background-color: rgba(255, 255, 255, 0.2) !important; color: #ffffff !important; }

        #schedule-table tr.today-highlight .note-input { border-color: rgba(30, 64, 175, 0.2) !important; color: #1e293b !important; background-color: rgba(255,255,255,0.7) !important; }
        [data-theme="dark"] #schedule-table tr.today-highlight .note-input { border-color: rgba(255,255,255,0.25) !important; color: #ffffff !important; background-color: rgba(0,0,0,0.35) !important; }
        #schedule-table tr.today-highlight .note-input::placeholder { color: #64748b !important; }
        [data-theme="dark"] #schedule-table tr.today-highlight .note-input::placeholder { color: #cbd5e1 !important; }

        #schedule-table tr.today-highlight .hour-badge { background-color: #1e40af !important; color: #ffffff !important; }
        [data-theme="dark"] #schedule-table tr.today-highlight .hour-badge { background-color: #ffffff !important; color: #1e40af !important; }
        
        #schedule-table tr.today-highlight .btn-complete-day { border-color: rgba(30, 64, 175, 0.3) !important; color: #1e293b !important; opacity: 0.9; }
        [data-theme="dark"] #schedule-table tr.today-highlight .btn-complete-day { border-color: rgba(255,255,255,0.4) !important; color: #ffffff !important; opacity: 0.9; }

        .completed-text { text-decoration: line-through; opacity: 0.7; }
        body.edit-mode .editable-text { border: 1px dashed #00b894; background-color: rgba(0, 184, 148, 0.1); cursor: text; }
        body.edit-mode .editable-text:focus { outline: none; background-color: rgba(0, 184, 148, 0.2); border-style: solid; }
        body.edit-mode .task-label { cursor: default; }

        .target-met { background-color: #00b894 !important; color: white !important; }
        .target-missed { background-color: #ff7675 !important; color: white !important; }

        .show-dropdown { display: block !important; }
        
        body { -webkit-tap-highlight-color: transparent; padding-bottom: 140px; background-color: var(--bg-color); color: var(--text-color); }
    </style>
</head>
<body class="transition-colors duration-300">

<div class="sticky top-0 z-[100] bg-white/80 dark:bg-slate-900/80 backdrop-blur-md px-4 py-3 md:px-6 border-b border-slate-200 dark:border-slate-800 shadow-sm transition-colors duration-300">
    <div class="max-w-[1300px] mx-auto flex flex-col sm:flex-row gap-3 justify-between items-center">
        <div class="flex flex-wrap items-center gap-2.5 w-full sm:w-auto justify-center sm:justify-start">
            <div class="text-xl md:text-2xl font-black bg-gradient-to-r from-purple-600 to-indigo-400 bg-clip-text text-transparent tracking-wide flex items-center gap-1">
                <span class="text-lg md:text-xl text-slate-800 dark:text-white">🎓</span> YKS
            </div>
            <button class="btn px-3 py-1.5 rounded-lg font-semibold text-xs bg-slate-600 text-white active:scale-95 transition-all" id="theme-toggle" title="Karanlık/Aydınlık Mod">🌙 Mod</button>
            <button class="btn btn-edit px-3 py-1.5 rounded-lg font-semibold text-xs bg-blue-600 text-white active:scale-95 transition-all" id="edit-btn">✏️ Düzenle</button>
            <div class="flex items-center gap-2 bg-white dark:bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 text-xs font-semibold shadow-sm transition-colors" title="Kamp Başlangıç Tarihi">
                <span>🗓️</span> 
                <input type="date" id="start-date-picker" class="bg-transparent border-none text-slate-800 dark:text-slate-100 font-bold outline-none cursor-pointer">
            </div>
        </div>
        
        <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto justify-center sm:justify-end">
            <span id="connection-status" class="text-[11px] font-bold px-3 py-1.5 rounded-full flex items-center gap-1.5 transition-all duration-300 shadow-sm bg-slate-100 text-slate-600 border border-slate-200 dark:bg-slate-800 dark:text-slate-400 dark:border-slate-700">⚪ Yükleniyor...</span>
            
            <div class="relative inline-block dropdown">
                <button class="px-3 py-1.5 rounded-lg font-semibold text-xs bg-slate-600 text-white active:scale-95 transition-all" id="settings-toggle">⚙️ Ayarlar</button>
                <div class="hidden absolute right-0 top-[120%] bg-white dark:bg-slate-800 min-w-[260px] py-2 shadow-xl rounded-xl z-[1000] border border-slate-200 dark:border-slate-700 overflow-hidden" id="settings-menu">
                    <div class="flex items-center justify-between px-4 py-2.5 text-xs font-semibold text-slate-700 dark:text-slate-300 cursor-default" onclick="event.stopPropagation();">
                        <div class="flex items-center gap-3">
                            <span>🎯</span> <span>Hedef (Saat):</span>
                        </div>
                        <input type="number" id="daily-target" value="8" min="1" max="24" class="w-14 p-1 rounded-md border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 text-center font-bold outline-none focus:border-emerald-500 transition-colors">
                    </div>
                    <div class="flex items-center justify-between px-4 py-2.5 text-xs font-semibold text-slate-700 dark:text-slate-300 cursor-default" onclick="event.stopPropagation();">
                        <div class="flex items-center gap-3">
                            <span>📚</span> <span>Ders Sütunu:</span>
                        </div>
                        <input type="number" id="col-count" value="5" min="1" max="10" class="w-14 p-1 rounded-md border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 text-center font-bold outline-none focus:border-emerald-500 transition-colors">
                    </div>
                    <div class="h-px bg-slate-200 dark:bg-slate-700 my-1.5 opacity-60"></div>
                    <button class="flex items-center gap-3 px-4 py-2.5 w-full text-left text-xs font-semibold text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors" id="notify-btn"><span class="w-5 text-center">🔔</span> <span>Bildirim İzni Ver</span></button>
                    <button class="flex items-center gap-3 px-4 py-2.5 w-full text-left text-xs font-semibold text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors" id="test-notify-btn"><span class="w-5 text-center">📩</span> <span>Test Bildirimi Gönder</span></button>
                    <div class="h-px bg-slate-200 dark:bg-slate-700 my-1.5 opacity-60"></div>
                    <button class="flex items-center gap-3 px-4 py-2.5 w-full text-left text-xs font-semibold text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors" id="export-btn"><span class="w-5 text-center">📥</span> <span>Yedeği İndir</span></button>
                    <button class="flex items-center gap-3 px-4 py-2.5 w-full text-left text-xs font-semibold text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors" id="import-trigger-btn"><span class="w-5 text-center">📤</span> <span>Yedek Yükle</span></button>
                    <div class="h-px bg-slate-200 dark:bg-slate-700 my-1.5 opacity-60"></div>
                    <button class="flex items-center gap-3 px-4 py-2.5 w-full text-left text-xs font-semibold text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 transition-colors" id="reset-btn"><span class="w-5 text-center">🗑️</span> <span>Tabloyu Sıfırla</span></button>
                </div>
            </div>
            <input type="file" id="import-file" class="hidden" accept=".json">
        </div>
    </div>
</div>

<div class="max-w-[1300px] mx-auto px-4 mt-6">
    <div class="flex flex-col md:flex-row justify-between items-center gap-3 text-sm font-semibold mb-2 text-slate-700 dark:text-slate-300">
        <span id="current-date-info" class="text-base font-bold text-slate-800 dark:text-white">YKS Kamp Takvimi</span>
        <div class="flex flex-wrap gap-2 items-center justify-center">
            <span class="px-3 py-1 rounded-md text-xs font-semibold flex gap-1.5 items-center bg-slate-600 text-white border-none shadow-md" id="streak-counter" title="Hedefe ulaşılan peş peşe günler">🔥 Seri: 0</span>
            <span class="px-3 py-1 rounded-md text-xs font-semibold flex gap-1.5 items-center bg-slate-800 text-orange-400 tracking-wide border-none" id="yks-countdown">YKS: Hesaplaşıyor...</span>
            <span id="progress-text" class="text-xs font-bold px-2 py-0.5 bg-slate-100 dark:bg-slate-800 rounded">%0 Tamamlandı</span>
        </div>
    </div>
    <div class="w-full h-2.5 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden mb-4 shadow-inner transition-colors">
        <div class="h-full bg-emerald-500 w-0 transition-all duration-700 ease-out shadow-sm" id="progress-fill"></div>
    </div>
    <div class="flex flex-wrap gap-2 text-xs font-semibold items-center" id="stats-panel"></div>
</div>

<div class="max-w-[1300px] mx-auto px-4 mt-6 flex flex-col items-center">
    <div class="w-full bg-white dark:bg-slate-800 rounded-xl shadow-md overflow-x-auto overflow-y-auto max-h-[75vh] border border-slate-200 dark:border-slate-700 transition-colors">
        <table id="schedule-table" class="w-full border-collapse text-xs md:text-sm text-left min-w-[1100px] text-slate-800 dark:text-slate-200">
            <thead>
                <tr id="header-row" class="bg-gradient-to-r from-purple-600 to-indigo-500 dark:from-indigo-600 dark:to-indigo-800 text-white font-semibold uppercase tracking-wider text-[11px] sticky top-0 z-20 shadow-sm">
                </tr>
            </thead>
            <tbody id="table-body" class="divide-y divide-slate-200 dark:divide-slate-700">
            </tbody>
        </table>
    </div>
    
    <div class="flex gap-3 w-full mt-4">
        <button class="flex-1 justify-center px-4 py-3 rounded-xl font-bold text-sm bg-emerald-500 text-white flex items-center gap-2 shadow active:scale-[0.98] hover:bg-emerald-600 transition-all" id="add-row-btn">➕ Yeni Gün Ekle</button>
        <button class="flex-1 justify-center px-4 py-3 rounded-xl font-bold text-sm bg-red-500 text-white flex items-center gap-2 shadow active:scale-[0.98] hover:bg-red-600 transition-all" id="del-row-btn">➖ Son Günü Sil</button>
    </div>

    <div class="w-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mt-6">
        <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm hover:-translate-y-0.5 transition-all">
            <h3 class="text-sm font-bold border-b border-slate-100 dark:border-slate-700 pb-2.5 mb-4 flex items-center gap-2 text-slate-800 dark:text-slate-100">📊 Ders Dağılımı (Saat)</h3>
            <div class="relative h-[260px] w-full flex justify-center"><canvas id="trendChart"></canvas></div>
        </div>
        <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm hover:-translate-y-0.5 transition-all">
            <h3 class="text-sm font-bold border-b border-slate-100 dark:border-slate-700 pb-2.5 mb-4 flex items-center gap-2 text-slate-800 dark:text-slate-100">📈 Günlük Çalışma Trendi (Saat)</h3>
            <div class="relative h-[260px] w-full flex justify-center"><canvas id="lineChart"></canvas></div>
        </div>
        <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm hover:-translate-y-0.5 transition-all">
            <h3 class="text-sm font-bold border-b border-slate-100 dark:border-slate-700 pb-2.5 mb-4 flex items-center gap-2 text-slate-800 dark:text-slate-100">📅 Haftalık Çalışma Özeti</h3>
            <div class="grid grid-cols-2 gap-2 max-h-[260px] overflow-y-auto" id="weekly-summary-grid-2"></div>
        </div>
        <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm hover:-translate-y-0.5 transition-all">
            <h3 class="text-sm font-bold border-b border-slate-100 dark:border-slate-700 pb-2.5 mb-4 flex items-center gap-2 text-slate-800 dark:text-slate-100">📚 Ders Bazlı Toplam Süre</h3>
            <div class="grid grid-cols-2 gap-2 max-h-[260px] overflow-y-auto" id="weekly-summary-grid"></div>
        </div>
    </div>
</div>

<div class="fixed bottom-6 right-6 z-[1000] bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 rounded-2xl p-4 w-[250px] shadow-2xl flex flex-col gap-2.5 transition-transform duration-300 md:bottom-4 md:right-4 md:p-3 md:w-[230px]" id="timer-widget">
    <div class="flex justify-between items-center">
        <div class="text-[11px] md:text-xs font-bold text-slate-500 dark:text-slate-400">⏱️ ÇALIŞMA SAYACI</div>
        <button class="text-slate-400 dark:text-slate-500 text-sm cursor-pointer p-0 line-none outline-none font-bold" id="minimize-btn">▼</button>
    </div>
    
    <div class="flex justify-around items-center py-1">
        <div class="flex flex-col items-center">
            <div class="text-2xl md:text-xl font-black font-mono tracking-wider text-emerald-500 tabular-nums" id="timer-display">00:00:00</div>
            <div class="text-[10px] text-slate-400 dark:text-slate-500 font-semibold uppercase">Odak</div>
        </div>
        <div class="flex flex-col items-center">
            <div class="text-base font-bold font-mono tracking-wider text-amber-500 tabular-nums" id="break-display">00:00:00</div>
            <div class="text-[10px] text-amber-500/70 font-semibold uppercase">Mola</div>
        </div>
    </div>
    
    <div class="flex gap-2 justify-center w-full">
        <button class="flex-1 text-[11px] md:text-xs px-2 py-1.5 rounded-lg font-bold text-white bg-emerald-500 shadow-sm active:scale-95 transition-all" id="timer-start-btn">▶️ Başlat</button>
        <button class="flex-1 text-[11px] md:text-xs px-2 py-1.5 rounded-lg font-bold text-slate-800 bg-amber-400 shadow-sm active:scale-95 transition-all" id="timer-break-btn">☕ Mola</button>
        <button class="px-2 py-1.5 rounded-lg text-xs font-bold text-white bg-slate-500 shadow-sm active:scale-95 transition-all" id="timer-reset-btn">🔄</button>
    </div>
    
    <div class="flex flex-col gap-1.5 w-full mt-1 border-t border-slate-100 dark:border-slate-700 pt-2">
        <div class="flex gap-1.5 w-full">
            <select id="timer-day-select" class="w-1/2 text-[11px] p-1.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-bold outline-none text-ellipsis overflow-hidden" title="Günü Seçin"></select>
            <select id="timer-lesson-select" class="w-1/2 text-[11px] p-1.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-bold outline-none text-ellipsis overflow-hidden" title="Dersi Seçin"></select>
        </div>
        <button class="w-full text-xs font-bold px-3 py-2 rounded-lg bg-blue-600 text-white shadow-sm active:scale-95 hover:bg-blue-700 transition-all" id="timer-save-btn">💾 Saate Ekle</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
    
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Kayıt Hatası:', err));
        });
    }
    const dbPromise = new Promise((resolve, reject) => {
        const req = indexedDB.open("YksCampProDB", 2);
        req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains("kampCache")) { db.createObjectStore("kampCache"); }
            if (!db.objectStoreNames.contains("syncQueue")) { db.createObjectStore("syncQueue", { keyPath: "id", autoIncrement: true }); }
        };
        req.onsuccess = (e) => resolve(e.target.result);
        req.onerror = (e) => reject(e.target.error);
    });
    async function saveToIDB(key, data) {
        try {
            const db = await dbPromise;
            const tx = db.transaction("kampCache", "readwrite");
            tx.objectStore("kampCache").put(data, key);
        } catch(e) { console.warn("IDB Save Error:", e); }
    }
    async function getFromIDB(key) {
        try {
            const db = await dbPromise;
            return new Promise(resolve => {
                const req = db.transaction("kampCache", "readonly").objectStore("kampCache").get(key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => resolve(null);
            });
        } catch(e) { return null; }
    }
    
    let isOnline = navigator.onLine;
    let activeSavingCount = 0; 

    function escapeHTML(str) {
        if (!str) return "";
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    async function getQueueCount() {
        try {
            const db = await dbPromise;
            return new Promise(resolve => {
                const tx = db.transaction("syncQueue", "readonly");
                const store = tx.objectStore("syncQueue");
                const req = store.count();

        async function triggerNotification(title, body) {
            if (!("Notification" in window)) {
                alert(`🔔 ${title}\n\n${body}`);
                return;
            }
            const options = { 
                body: body, 
                icon: "https://cdn-icons-png.flaticon.com/512/2936/2936758.png",
                badge: "https://cdn-icons-png.flaticon.com/512/2936/2936758.png",
                requireInteraction: true 
            };
            if (Notification.permission === "granted") {
                if ('serviceWorker' in navigator) {
                    try {
                        const reg = await navigator.serviceWorker.getRegistration();
                        if (reg && 'showNotification' in reg) {
                            await reg.showNotification(title, options);
                            return;
                        }
                    } catch (e) { console.warn("SW bildirim hatası, standarda dönülüyor:", e); }
                }
                try { new Notification(title, options); } catch (err) { alert(`🔔 ${title}\n\n${body}`); }
            } else if (Notification.permission !== "denied") {
                const permission = await Notification.requestPermission();
                if (permission === "granted") { triggerNotification(title, body); } else { alert(`🔔 ${title}\n\n${body}`); }
            } else {
                alert(`🔔 ${title}\n\n${body}`);
            }
        }

        function getFirstLessonTime() {
            const firstTimeEl = document.querySelector('[data-edit-id="th-time-0"]');
            const timeStr = firstTimeEl ? firstTimeEl.innerText.trim() : "09:30 - 11:30";
            const startPart = timeStr.split('-')[0].trim();
            const match = startPart.match(/(\d{1,2})[:\.](\d{2})/);
            if (match) {
                return { hours: parseInt(match[1]), minutes: parseInt(match[2]) };
            }
            return { hours: 9, minutes: 30 };
        }

        async function checkAutomatedNotifications() {
            const now = new Date();
            const todayStr = now.toDateString();

            const firstLessonTime = getFirstLessonTime();
            let targetHours = firstLessonTime.hours;
            let targetMinutes = firstLessonTime.minutes - 30;
            
            if (targetMinutes < 0) {
                targetHours -= 1;
                targetMinutes += 60;
            }
            if (targetHours < 0) {
                targetHours = 0; targetMinutes = 0;
            }
            
            if (now.getHours() === targetHours && now.getMinutes() === targetMinutes) {
                lastAutoNotifiedDate = todayStr;
                const firstSubjEl = document.getElementById("th-subj-0-text");
                const firstSubjName = firstSubjEl ? firstSubjEl.innerText.trim() : "İlk Ders";

                    `İlk dersiniz (${firstSubjName}) 30 dakika içinde başlayacak! Hazırlıklarını tamamla. 🚀`
                );
            }
        }

        let mainInterval = null;
        const updateTimerDisplay = () => {
            const format = (sec) => {
                const h = String(Math.floor(sec / 3600)).padStart(2, '0');
                const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
                const s = String(sec % 60).padStart(2, '0');
                return `${h}:${m}:${s}`;
            };
            document.getElementById("timer-display").innerText = format(timerSeconds);
            document.getElementById("break-display").innerText = format(breakSeconds);
        };
        
        const syncTimeWithTimestamp = () => {
            if (timerState === 'stopped') return;
            const now = Date.now();
            const lastActiveTimestamp = parseInt(localStorage.getItem("timerLastActiveTimestamp")) || now;
            const elapsedMs = now - lastActiveTimestamp;
            
            if (elapsedMs >= 1000) {
                const addedSec = Math.floor(elapsedMs / 1000);
                if (timerState === 'running') {
                    timerSeconds += addedSec;
                    localStorage.setItem("timerSeconds", timerSeconds);
                } else if (timerState === 'break') {
                    breakSeconds += addedSec;
                    localStorage.setItem("breakSeconds", breakSeconds);
                }
                localStorage.setItem("timerLastActiveTimestamp", lastActiveTimestamp + (addedSec * 1000));
            }
        };

                applyDataToUI(); 
                syncFirebaseSet(`${SHARED_PATH}tasks/${taskId}`, taskData);

                let currentLessonIdx = parseInt(lessonSelect.value);
                let nextLessonIdx = currentLessonIdx;
                for (let i = 1; i <= currentCols; i++) {
                    let checkIdx = (currentLessonIdx + i) % currentCols;
                    const checkHeaderTime = document.querySelector(`th span[data-edit-id="th-time-${checkIdx}"]`);
                    if (checkHeaderTime && getHoursFromText(checkHeaderTime.innerText) > 0) {
                        nextLessonIdx = checkIdx;
                        break;
                    }
                }
                lessonSelect.value = nextLessonIdx;

                timerState = 'stopped'; 
                clearInterval(mainInterval); 
                mainInterval = null;
                timerSeconds = 0; 
                breakSeconds = 0;
                localStorage.setItem("timerState", 'stopped');
                localStorage.setItem("timerSeconds", 0); 
                localStorage.setItem("breakSeconds", 0);
                localStorage.removeItem("timerLastActiveTimestamp");
                updateTimerDisplay(); 
                applyUIState();
            }
        });
        document.getElementById('minimize-btn').addEventListener('click', (e) => {
            const widget = document.getElementById('timer-widget');
            widget.classList.toggle('minimized');
            if (widget.classList.contains('minimized')) {
                widget.style.transform = 'translateY(calc(100% - 32px))';
                e.target.innerText = '▲';
            } else {
                widget.style.transform = 'none';
                e.target.innerText = '▼';
            }
        });
    });
</script>
</body>
</html>
